name: Wails Release & Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.build.name }}
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          # Linux WebKit 4.1 (Ubuntu 24.04+, Debian 12+, Fedora 40+, Arch)
          - { name: Linux amd64 (WebKit 4.1), platform: linux/amd64, os: ubuntu-24.04 }
          - { name: Linux arm64 (WebKit 4.1), platform: linux/arm64, os: ubuntu-24.04 }

          # Linux WebKit 4.0 (Ubuntu 20.04/22.04, Debian 11, RHEL 8/9)
          - { name: Linux amd64 (WebKit 4.0), platform: linux/amd64, os: ubuntu-22.04 }
          - { name: Linux arm64 (WebKit 4.0), platform: linux/arm64, os: ubuntu-22.04 }

          # Windows targets
          - { name: Windows amd64, platform: windows/amd64, os: windows-latest, nsis: true }
          - { name: Windows arm64, platform: windows/arm64, os: windows-latest, nsis: true }

          # macOS targets
          - { name: macOS amd64, platform: darwin/amd64, os: macos-latest }
          - { name: macOS arm64, platform: darwin/arm64, os: macos-latest }
          - { name: macOS universal, platform: darwin/universal, os: macos-latest }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Wails App
        uses: ./.github/actions/build-wails
        id: build
        with:
          build-name: telepresence-gui
          build-platform: ${{ matrix.build.platform }}
          nsis: ${{ matrix.build.nsis || 'false' }}
          package: 'true'
          publish-release: 'false'

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          rm -f artifact_meta.json
          sha256sum * > checksums.txt
          echo "Generated SHA256 Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
