name: "Build Wails App"
description: "Runs wails build and fixes executable permissions per OS"
inputs:
  build:
    description: "Whether to run the build"
    required: false
    default: "true"
  app-working-directory:
    required: false
    default: "."
  build-platform:
    required: true
  build-name:
    required: true
  wails-build-webview2:
    required: false
    default: "download"
  build-options:
    description: "Precomputed BUILD_OPTIONS string"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Build App
      if: inputs.build == 'true'
      env:
        BUILD_OPTIONS: ${{ inputs.build-options }}
        RUNNER_OS_NAME: ${{ runner.os }}
        BUILD_PLATFORM: ${{ inputs.build-platform }}
        BUILD_NAME: ${{ inputs.build-name }}
        WV2_METHOD: ${{ inputs.wails-build-webview2 }}
      working-directory: ${{ inputs.app-working-directory }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS_NAME}" = "Linux" ] && [ "${BUILD_PLATFORM}" = "linux/arm64" ]; then
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        fi

        OUTPUT_NAME="${BUILD_NAME}"
        if [[ "${BUILD_PLATFORM}" == windows/* ]] && [[ "$OUTPUT_NAME" != *.exe ]]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi

        echo "[DEBUG_LOG] Running: wails build --platform ${BUILD_PLATFORM} -webview2 ${WV2_METHOD} -o ${OUTPUT_NAME} ${BUILD_OPTIONS}"
        wails build --platform "${BUILD_PLATFORM}" -webview2 "${WV2_METHOD}" -o "${OUTPUT_NAME}" ${BUILD_OPTIONS}
