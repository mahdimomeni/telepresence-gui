name: "Sign"
description: "Unified signing for macOS and Windows (conditional by OS); notarizes on tags for macOS"
inputs:
  sign:
    required: false
    default: "false"
  app-working-directory:
    required: false
    default: "."
  build-name:
    required: true
  # macOS
  sign-macos-apple-password:
    required: false
    default: ''
    description: ""
  sign-macos-app-id:
    required: false
    default: ''
    description: ""
  sign-macos-app-cert:
    required: false
    default: ''
    description: ""
  sign-macos-app-cert-password:
    required: false
    default: ''
    description: ""
  sign-macos-installer-id:
    required: false
    default: ''
    description: ""
  sign-macos-installer-cert:
    required: false
    default: ''
    description: ""
  sign-macos-installer-cert-password:
    required: false
    default: ''
    description: ""
  # Windows
  sign-windows-cert:
    required: false
    default: ''
    description: ""
  sign-windows-cert-password:
    required: false
    default: ''
    description: ""
runs:
  using: "composite"
  steps:
    # macOS signing flow
    - name: Import Code-Signing Certificates for macOS
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      uses: Apple-Actions/import-codesign-certs@v3
      with:
        keychain-password: ${{ inputs.sign-macos-apple-password }}
        p12-file-base64: ${{ inputs.sign-macos-app-cert }}
        p12-password: ${{ inputs.sign-macos-app-cert-password }}

    - name: Import Code-Signing Certificates for macOS Installer
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      uses: Apple-Actions/import-codesign-certs@v3
      with:
        keychain-password: ${{ inputs.sign-macos-apple-password }}
        p12-file-base64: ${{ inputs.sign-macos-installer-cert }}
        p12-password: ${{ inputs.sign-macos-installer-cert-password }}
        create-keychain: false

    - name: Sign macOS .app with gon
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
      run: |
        echo "Signing Package"
        gon -log-level=info ./build/darwin/gon-sign.json

    - name: Build .app zip file
      if: runner.os == 'macOS'
      working-directory: ${{ inputs.app-working-directory }}
      shell: bash
      env:
        APP_DIR: ${{ inputs.app-working-directory }}
        APP_NAME: ${{ inputs.build-name }}
      run: |
        ditto -c -k --keepParent "${APP_DIR}/build/bin/${APP_NAME}.app" "${APP_DIR}/build/bin/${APP_NAME}.app.zip"

    - name: Build Installer (signed)
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-installer-id != '' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APP_DIR: ${{ inputs.app-working-directory }}
        APP_NAME: ${{ inputs.build-name }}
        SIGN_ID: ${{ inputs.sign-macos-installer-id }}
      run: |
        productbuild --sign "${SIGN_ID}" --component "${APP_DIR}/build/bin/${APP_NAME}.app" /Applications "${APP_DIR}/build/bin/${APP_NAME}.pkg"

    - name: Build Installer (unsigned)
      if: runner.os == 'macOS' && inputs.sign-macos-installer-id == '' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APP_DIR: ${{ inputs.app-working-directory }}
        APP_NAME: ${{ inputs.build-name }}
      run: |
        productbuild --component "${APP_DIR}/build/bin/${APP_NAME}.app" /Applications "${APP_DIR}/build/bin/${APP_NAME}.pkg"

    - name: Notarize Installer and zip with gon
      if: runner.os == 'macOS' && inputs.sign != 'false' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      working-directory: ${{ inputs.app-working-directory }}
      env:
        APPLE_PASSWORD: ${{ inputs.sign-macos-apple-password }}
        APP_DIR: ${{ inputs.app-working-directory }}
      run: |
        gon -log-level=info "${APP_DIR}/build/darwin/gon-notarize.json"

    # Windows signing flow
    - name: Sign Windows binaries
      shell: powershell
      if: runner.os == 'Windows' && inputs.sign != 'false' && inputs.sign-windows-cert != ''
      working-directory: ${{ inputs.app-working-directory }}
      env:
        WIN_CERT: ${{ inputs.sign-windows-cert }}
        WIN_CERT_PW: ${{ inputs.sign-windows-cert-password }}
        BUILD_NAME: ${{ inputs.build-name }}
      run: |
        Write-Host "Locating signtool.exe..."
        $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        if (-not $signtool) {
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
        }
        if (-not $signtool) {
          Write-Error "signtool.exe could not be found."
          exit 1
        }
        Write-Host "Using signtool at: $signtool"

        New-Item -ItemType Directory -Force -Path certificate | Out-Null
        Set-Content -Path certificate\certificate.txt -Value $Env:WIN_CERT
        certutil -decode certificate\certificate.txt certificate\certificate.pfx | Out-Null

        Write-Host "Signing executable: .\build\bin\$($Env:BUILD_NAME).exe"
        if (Test-Path ".\build\bin\$($Env:BUILD_NAME).exe") {
          & $signtool sign /fd sha256 /tr http://ts.ssl.com /f certificate\certificate.pfx /p $Env:WIN_CERT_PW ".\build\bin\$($Env:BUILD_NAME).exe"
        }

        Write-Host "Signing installers..."
        Get-ChildItem -Path ".\build\bin" -Filter "*installer*.exe" | ForEach-Object {
          Write-Host "Signing: $($_.FullName)"
          & $signtool sign /fd sha256 /tr http://ts.ssl.com /f certificate\certificate.pfx /p $Env:WIN_CERT_PW $_.FullName
        }

        # Cleanup certificate
        Remove-Item -Recurse -Force certificate
