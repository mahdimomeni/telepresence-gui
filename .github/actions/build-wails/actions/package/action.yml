name: "Package & Release"
description: "Uploads build artifacts and publishes GitHub Release on tag if enabled"
inputs:
  package:
    required: false
    default: "true"
  build-name:
    required: true
  build-platform:
    description: "Build platform (e.g., linux/amd64, windows/arm64, darwin/universal)"
    required: false
    default: ""
  os:
    description: "OS name (optional, from discovery). Defaults to runner.os"
    required: false
    default: ""
  arch:
    description: "Architecture (optional, from discovery). Defaults to detected arch"
    required: false
    default: ""
  tag:
    description: "Git tag (optional, from discovery)."
    required: false
    default: ""
  is-tag:
    description: "Whether the ref is a tag (optional, from discovery)."
    required: false
    default: ""
  short-sha:
    description: "Short commit SHA (optional, from discovery)."
    required: false
    default: ""
  ref:
    description: "Git ref (optional, from discovery)."
    required: false
    default: ""
  include-meta:
    description: "Include artifact_meta.json with discovery metadata in the uploaded artifact"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Compute artifact name
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        PLATFORM_IN="${{ inputs.build-platform }}"
        TAG_IN="${{ inputs.tag }}"
        SHORT_SHA_IN="${{ inputs.short-sha }}"

        # Parse target OS & ARCH from build-platform (e.g. linux/arm64 -> linux, arm64)
        TARGET_OS=""
        TARGET_ARCH=""
        if [ -n "$PLATFORM_IN" ]; then
          TARGET_OS="${PLATFORM_IN%%/*}"
          TARGET_ARCH="${PLATFORM_IN#*/}"
        fi

        # Fallbacks if build-platform is not provided
        if [ -z "$TARGET_OS" ]; then
          TARGET_OS="${{ inputs.os }}"
          if [ -z "$TARGET_OS" ]; then TARGET_OS="${RUNNER_OS:-}"; fi
        fi
        if [ -z "$TARGET_ARCH" ]; then
          TARGET_ARCH="${{ inputs.arch }}"
        fi

        # Normalize OS representation for asset naming
        case "$(echo "$TARGET_OS" | tr '[:upper:]' '[:lower:]')" in
          darwin|macos) NORM_OS="macOS" ;;
          windows) NORM_OS="Windows" ;;
          linux) NORM_OS="Linux" ;;
          *) NORM_OS="$TARGET_OS" ;;
        esac

        # Resolve revision label
        if [ -n "$TAG_IN" ]; then
          REV="$TAG_IN"
        else
          if [ -z "$SHORT_SHA_IN" ]; then
            GHS="${GITHUB_SHA:-}"
            SHORT_SHA_IN="${GHS:0:7}"
          fi
          REV="$SHORT_SHA_IN"
        fi

        NAME="${{ inputs.build-name }}_${NORM_OS}_${TARGET_ARCH}_${REV}"
        echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_OUTPUT"
        echo "TARGET_OS=$TARGET_OS" >> "$GITHUB_OUTPUT"
        echo "TARGET_ARCH=$TARGET_ARCH" >> "$GITHUB_OUTPUT"
        echo "NORM_OS=$NORM_OS" >> "$GITHUB_OUTPUT"

    - name: Write artifact_meta.json
      if: inputs.package == 'true' && inputs.include-meta == 'true'
      shell: bash
      env:
        IN_BUILD_NAME: ${{ inputs.build-name }}
        IN_OS: ${{ steps.meta.outputs.NORM_OS }}
        IN_ARCH: ${{ steps.meta.outputs.TARGET_ARCH }}
        IN_REF: ${{ inputs.ref }}
        IN_TAG: ${{ inputs.tag }}
        IN_SHORT_SHA: ${{ inputs.short-sha }}
      run: |
        set -euo pipefail
        ref_val="$IN_REF"
        branch_val=""
        case "$ref_val" in
          refs/heads/*) branch_val="${ref_val#refs/heads/}" ;;
        esac
        cat > artifact_meta.json <<JSON
        {
          "build_name": "${IN_BUILD_NAME}",
          "os": "${IN_OS}",
          "arch": "${IN_ARCH}",
          "ref": "${ref_val}",
          "branch": "${branch_val}",
          "tag": "${IN_TAG}",
          "short_sha": "${IN_SHORT_SHA}"
        }
        JSON

    - name: Stage unique dist assets
      if: inputs.package == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist

        target_os="$(echo "${{ steps.meta.outputs.TARGET_OS }}" | tr '[:upper:]' '[:lower:]')"
        norm_os="${{ steps.meta.outputs.NORM_OS }}"
        target_arch="${{ steps.meta.outputs.TARGET_ARCH }}"
        suffix="${norm_os}_${target_arch}"

        shopt -s nullglob
        for f in build/bin/*; do
          if [ -f "$f" ]; then
            filename=$(basename "$f")

            ext=""
            base="$filename"

            if [[ "$filename" == *.app.zip ]]; then
              ext=".app.zip"
              base="${filename%.app.zip}"
            elif [[ "$filename" == *.* ]]; then
              ext=".${filename##*.}"
              base="${filename%.*}"
            fi

            # Guarantee .exe for Windows binaries
            if [ "$target_os" = "windows" ]; then
              if [ -z "$ext" ]; then
                ext=".exe"
              fi
            fi

            new_name="${base}_${suffix}${ext}"
            cp "$f" "dist/${new_name}"
            echo "[DEBUG_LOG] Staged dist/${new_name}"
          fi
        done

        if [ -f "artifact_meta.json" ]; then
          cp artifact_meta.json "dist/artifact_meta_${suffix}.json"
        fi

    - uses: actions/upload-artifact@v4
      if: inputs.package == 'true'
      with:
        overwrite: 'true'
        name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
        path: dist/*

    - name: Release
      uses: softprops/action-gh-release@v1
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ inputs.tag }}
        files: dist/*