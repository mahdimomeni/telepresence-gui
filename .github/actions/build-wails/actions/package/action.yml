name: "Package & Release"
description: "Uploads build artifacts and publishes GitHub Release on tag if enabled"
inputs:
  package:
    required: false
    default: "true"
  build-name:
    required: true
  build-platform:
    description: "Build platform (e.g., linux/amd64, windows/arm64, darwin/universal)"
    required: false
    default: ""
  os:
    description: "OS name (optional, from discovery). Defaults to runner.os"
    required: false
    default: ""
  arch:
    description: "Architecture (optional, from discovery). Defaults to detected arch"
    required: false
    default: ""
  tag:
    description: "Git tag (optional, from discovery)."
    required: false
    default: ""
  is-tag:
    description: "Whether the ref is a tag (optional, from discovery)."
    required: false
    default: ""
  short-sha:
    description: "Short commit SHA (optional, from discovery)."
    required: false
    default: ""
  ref:
    description: "Git ref (optional, from discovery)."
    required: false
    default: ""
  include-meta:
    description: "Include artifact_meta.json with discovery metadata in the uploaded artifact"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Compute artifact name
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        PLATFORM_IN="${{ inputs.build-platform }}"
        TAG_IN="${{ inputs.tag }}"
        SHORT_SHA_IN="${{ inputs.short-sha }}"

        # Parse target OS & ARCH from build-platform (e.g. linux/arm64 -> linux, arm64)
        TARGET_OS=""
        TARGET_ARCH=""
        if [ -n "$PLATFORM_IN" ]; then
          TARGET_OS="${PLATFORM_IN%%/*}"
          TARGET_ARCH="${PLATFORM_IN#*/}"
        fi

        # Fallbacks if build-platform is not provided
        if [ -z "$TARGET_OS" ]; then
          TARGET_OS="${{ inputs.os }}"
          if [ -z "$TARGET_OS" ]; then TARGET_OS="${RUNNER_OS:-}"; fi
        fi
        if [ -z "$TARGET_ARCH" ]; then
          TARGET_ARCH="${{ inputs.arch }}"
        fi

        # Normalize OS & ARCH according to go-selfupdate (GOOS / GOARCH standard lowercase)
        TARGET_OS=$(echo "$TARGET_OS" | tr '[:upper:]' '[:lower:]')
        if [ "$TARGET_OS" = "macos" ]; then TARGET_OS="darwin"; fi
        TARGET_ARCH=$(echo "$TARGET_ARCH" | tr '[:upper:]' '[:lower:]')

        # Resolve revision label
        if [ -n "$TAG_IN" ]; then
          REV="$TAG_IN"
        else
          if [ -z "$SHORT_SHA_IN" ]; then
            GHS="${GITHUB_SHA:-}"
            SHORT_SHA_IN="${GHS:0:7}"
          fi
          REV="$SHORT_SHA_IN"
        fi

        NAME="${{ inputs.build-name }}_${TARGET_OS}_${TARGET_ARCH}_${REV}"
        echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_OUTPUT"
        echo "TARGET_OS=$TARGET_OS" >> "$GITHUB_OUTPUT"
        echo "TARGET_ARCH=$TARGET_ARCH" >> "$GITHUB_OUTPUT"
        echo "REV=$REV" >> "$GITHUB_OUTPUT"

    - name: Write artifact_meta.json
      if: inputs.package == 'true' && inputs.include-meta == 'true'
      shell: bash
      env:
        IN_BUILD_NAME: ${{ inputs.build-name }}
        IN_OS: ${{ steps.meta.outputs.TARGET_OS }}
        IN_ARCH: ${{ steps.meta.outputs.TARGET_ARCH }}
        IN_REF: ${{ inputs.ref }}
        IN_TAG: ${{ inputs.tag }}
        IN_SHORT_SHA: ${{ inputs.short-sha }}
      run: |
        set -euo pipefail
        ref_val="$IN_REF"
        branch_val=""
        case "$ref_val" in
          refs/heads/*) branch_val="${ref_val#refs/heads/}" ;;
        esac
        cat > artifact_meta.json <<JSON
        {
          "build_name": "${IN_BUILD_NAME}",
          "os": "${IN_OS}",
          "arch": "${IN_ARCH}",
          "ref": "${ref_val}",
          "branch": "${branch_val}",
          "tag": "${IN_TAG}",
          "short_sha": "${IN_SHORT_SHA}"
        }
        JSON

    - name: Package archive assets
      if: inputs.package == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist

        target_os="${{ steps.meta.outputs.TARGET_OS }}"
        target_arch="${{ steps.meta.outputs.TARGET_ARCH }}"
        build_name="${{ inputs.build-name }}"
        tag="${{ inputs.tag }}"

        # Format: <name>_<version>_<os>_<arch> or <name>_<os>_<arch>
        if [ -n "$tag" ]; then
          clean_tag="${tag#v}"
          base_archive="${build_name}_${clean_tag}_${target_os}_${target_arch}"
        else
          clean_tag="0.0.0-${{ steps.meta.outputs.REV }}"
          base_archive="${build_name}_${target_os}_${target_arch}"
        fi

        bin_dir="build/bin"

        if [ "$target_os" = "windows" ]; then
          archive_name="${base_archive}.zip"
          if [ -f "${bin_dir}/${build_name}.exe" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${bin_dir}/${build_name}.exe' -DestinationPath 'dist/${archive_name}' -Force"
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${bin_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          fi
          echo "[DEBUG_LOG] Successfully packaged dist/${archive_name}"

        elif [ "$target_os" = "darwin" ]; then
          archive_name="${base_archive}.tar.gz"
          if [ -d "${bin_dir}/${build_name}.app" ]; then
            tar -czf "dist/${archive_name}" -C "$bin_dir" "${build_name}.app"
          elif [ -f "${bin_dir}/${build_name}" ]; then
            tar -czf "dist/${archive_name}" -C "$bin_dir" "${build_name}"
          else
            tar -czf "dist/${archive_name}" -C "$bin_dir" .
          fi
          echo "[DEBUG_LOG] Successfully packaged dist/${archive_name}"

        else
          # Linux tar.gz packaging
          archive_name="${base_archive}.tar.gz"
          if [ -f "${bin_dir}/${build_name}" ]; then
            tar -czf "dist/${archive_name}" -C "$bin_dir" "${build_name}"
          else
            tar -czf "dist/${archive_name}" -C "$bin_dir" .
          fi
          echo "[DEBUG_LOG] Successfully packaged dist/${archive_name}"

          # Linux distro packaging via nfpm
          if [ -f "nfpm.yaml" ]; then
            echo "[DEBUG_LOG] Installing nfpm..."
            if ! command -v nfpm >/dev/null 2>&1; then
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
            fi

            export APP_NAME="$build_name"
            export TARGET_ARCH="$target_arch"
            export VERSION="$clean_tag"

            echo "[DEBUG_LOG] Generating Linux distribution packages..."
            nfpm package --packager deb --target dist/
            nfpm package --packager rpm --target dist/
            nfpm package --packager apk --target dist/
            nfpm package --packager archlinux --target dist/ || true
          fi
        fi

    - uses: actions/upload-artifact@v4
      if: inputs.package == 'true'
      with:
        overwrite: 'true'
        name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
        path: dist/*

    - name: Release
      uses: softprops/action-gh-release@v1
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ inputs.tag }}
        files: dist/*
        body_path: CHANGELOG.md