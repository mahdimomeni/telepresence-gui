name: "Package & Release"
description: "Uploads build artifacts and optionally publishes GitHub Release on tag"
inputs:
  package:
    required: false
    default: "true"
  build-name:
    required: true
  build-platform:
    description: "Build platform (e.g., linux/amd64, windows/arm64, darwin/universal)"
    required: false
    default: ""
  os:
    description: "OS name (optional, from discovery). Defaults to runner.os"
    required: false
    default: ""
  arch:
    description: "Architecture (optional, from discovery). Defaults to detected arch"
    required: false
    default: ""
  tag:
    description: "Git tag (optional, from discovery)."
    required: false
    default: ""
  is-tag:
    description: "Whether the ref is a tag (optional, from discovery)."
    required: false
    default: ""
  short-sha:
    description: "Short commit SHA (optional, from discovery)."
    required: false
    default: ""
  ref:
    description: "Git ref (optional, from discovery)."
    required: false
    default: ""
  include-meta:
    description: "Include artifact_meta.json with discovery metadata in the uploaded artifact"
    required: false
    default: "true"
  publish-release:
    description: "Directly publish release in this action (default: false to allow atomic workflow releases)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Compute artifact name
      id: meta
      shell: bash
      env:
        PLATFORM_IN: ${{ inputs.build-platform }}
        TAG_IN: ${{ inputs.tag }}
        SHORT_SHA_IN: ${{ inputs.short-sha }}
        OS_IN: ${{ inputs.os }}
        ARCH_IN: ${{ inputs.arch }}
        BUILD_NAME_IN: ${{ inputs.build-name }}
        RUNNER_OS_IN: ${{ runner.os }}
        GITHUB_SHA_IN: ${{ github.sha }}
      run: |
        set -euo pipefail
        TARGET_OS=""
        TARGET_ARCH=""
        if [ -n "$PLATFORM_IN" ]; then
          TARGET_OS="${PLATFORM_IN%%/*}"
          TARGET_ARCH="${PLATFORM_IN#*/}"
        fi

        if [ -z "$TARGET_OS" ]; then
          TARGET_OS="$OS_IN"
          if [ -z "$TARGET_OS" ]; then TARGET_OS="$RUNNER_OS_IN"; fi
        fi
        if [ -z "$TARGET_ARCH" ]; then
          TARGET_ARCH="$ARCH_IN"
        fi

        TARGET_OS=$(echo "$TARGET_OS" | tr '[:upper:]' '[:lower:]')
        if [ "$TARGET_OS" = "macos" ]; then TARGET_OS="darwin"; fi
        TARGET_ARCH=$(echo "$TARGET_ARCH" | tr '[:upper:]' '[:lower:]')

        if [ -n "$TAG_IN" ]; then
          REV="$TAG_IN"
        else
          if [ -z "$SHORT_SHA_IN" ]; then
            SHORT_SHA_IN="${GITHUB_SHA_IN:0:7}"
          fi
          REV="$SHORT_SHA_IN"
        fi

        ABI_LABEL=""
        if [ "$TARGET_OS" = "linux" ]; then
          DISTRO_VER=$(lsb_release -rs 2>/dev/null || echo "24.04")
          if [[ "$DISTRO_VER" == "20.04" || "$DISTRO_VER" == "22.04" ]]; then
            ABI_LABEL="_webkit40"
          else
            ABI_LABEL="_webkit41"
          fi
        fi

        NAME="${BUILD_NAME_IN}_${TARGET_OS}_${TARGET_ARCH}${ABI_LABEL}_${REV}"
        echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_OUTPUT"
        echo "TARGET_OS=$TARGET_OS" >> "$GITHUB_OUTPUT"
        echo "TARGET_ARCH=$TARGET_ARCH" >> "$GITHUB_OUTPUT"
        echo "ABI_LABEL=$ABI_LABEL" >> "$GITHUB_OUTPUT"
        echo "REV=$REV" >> "$GITHUB_OUTPUT"

    - name: Write artifact_meta.json
      if: inputs.package == 'true' && inputs.include-meta == 'true'
      shell: bash
      env:
        IN_BUILD_NAME: ${{ inputs.build-name }}
        IN_OS: ${{ steps.meta.outputs.TARGET_OS }}
        IN_ARCH: ${{ steps.meta.outputs.TARGET_ARCH }}
        IN_REF: ${{ inputs.ref }}
        IN_TAG: ${{ inputs.tag }}
        IN_SHORT_SHA: ${{ inputs.short-sha }}
      run: |
        set -euo pipefail
        ref_val="$IN_REF"
        branch_val=""
        case "$ref_val" in
          refs/heads/*) branch_val="${ref_val#refs/heads/}" ;;
        esac
        cat > artifact_meta.json <<JSON
        {
          "build_name": "${IN_BUILD_NAME}",
          "os": "${IN_OS}",
          "arch": "${IN_ARCH}",
          "ref": "${ref_val}",
          "branch": "${branch_val}",
          "tag": "${IN_TAG}",
          "short_sha": "${IN_SHORT_SHA}"
        }
        JSON

    - name: Package archive assets
      if: inputs.package == 'true'
      shell: bash
      env:
        TARGET_OS: ${{ steps.meta.outputs.TARGET_OS }}
        TARGET_ARCH: ${{ steps.meta.outputs.TARGET_ARCH }}
        ABI_LABEL: ${{ steps.meta.outputs.ABI_LABEL }}
        BUILD_NAME: ${{ inputs.build-name }}
        TAG: ${{ inputs.tag }}
        REV: ${{ steps.meta.outputs.REV }}
      run: |
        set -euo pipefail
        mkdir -p dist

        if [ -n "$TAG" ]; then
          clean_tag="${TAG#v}"
          base_archive="${BUILD_NAME}_${clean_tag}_${TARGET_OS}_${TARGET_ARCH}${ABI_LABEL}"
        else
          clean_tag="0.0.0-${REV}"
          base_archive="${BUILD_NAME}_${TARGET_OS}_${TARGET_ARCH}${ABI_LABEL}"
        fi

        bin_dir="build/bin"

        if [ "$TARGET_OS" = "windows" ]; then
          archive_name="${base_archive}.zip"
          
          # 1. Compress portable executable into .zip
          if [ -f "${bin_dir}/${BUILD_NAME}.exe" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${bin_dir}/${BUILD_NAME}.exe' -DestinationPath 'dist/${archive_name}' -Force"
            echo "[DEBUG_LOG] Successfully packaged portable zip: dist/${archive_name}"
          fi

          # 2. Copy the installer directly to dist/ as a standalone .exe asset
          shopt -s nullglob
          for inst in "${bin_dir}"/*installer*.exe; do
            if [ -f "$inst" ]; then
              cp "$inst" dist/
              echo "[DEBUG_LOG] Added standalone installer asset: $(basename "$inst")"
            fi
          done

        elif [ "$TARGET_OS" = "darwin" ]; then
          archive_name="${base_archive}.tar.gz"
          if [ -d "${bin_dir}/${BUILD_NAME}.app" ]; then
            tar -czf "dist/${archive_name}" -C "$bin_dir" "${BUILD_NAME}.app"
          elif [ -f "${bin_dir}/${BUILD_NAME}" ]; then
            tar -czf "dist/${archive_name}" -C "$bin_dir" "${BUILD_NAME}"
          else
            tar -czf "dist/${archive_name}" -C "$bin_dir" .
          fi
          echo "[DEBUG_LOG] Successfully packaged dist/${archive_name}"

        else
          # Linux packaging
          archive_name="${base_archive}.tar.gz"
          if [ -f "${bin_dir}/${BUILD_NAME}" ]; then
            tar -czf "dist/${archive_name}" -C "$bin_dir" "${BUILD_NAME}"
          else
            tar -czf "dist/${archive_name}" -C "$bin_dir" .
          fi
          echo "[DEBUG_LOG] Successfully packaged dist/${archive_name}"

          if [ -f "nfpm.yaml" ]; then
            if ! command -v nfpm >/dev/null 2>&1; then
              echo "[DEBUG_LOG] Installing nfpm..."
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
            fi

            export APP_NAME="$BUILD_NAME"
            export TARGET_ARCH="$TARGET_ARCH"
            export VERSION=$(echo "$clean_tag" | tr '-' '+')
            export PKG_NAME_SUFFIX="$ABI_LABEL"

            DISTRO_VER=$(lsb_release -rs 2>/dev/null || echo "24.04")
            if [[ "$DISTRO_VER" == "20.04" || "$DISTRO_VER" == "22.04" ]]; then
              export WEBKIT_DEB_DEP="libwebkit2gtk-4.0-37"
              export WEBKIT_RPM_DEP="webkit2gtk3"
              export WEBKIT_APK_DEP="webkit2gtk"
              export WEBKIT_ARCH_DEP="webkit2gtk"
            else
              export WEBKIT_DEB_DEP="libwebkit2gtk-4.1-0"
              export WEBKIT_RPM_DEP="webkit2gtk4.1"
              export WEBKIT_APK_DEP="webkit2gtk"
              export WEBKIT_ARCH_DEP="webkit2gtk-4.1"
            fi

            envsubst < nfpm.yaml > dist/nfpm-resolved.yaml

            echo "[DEBUG_LOG] Generating Linux distribution packages ($DISTRO_VER / $ABI_LABEL)..."
            nfpm package -f dist/nfpm-resolved.yaml --packager deb --target dist/
            nfpm package -f dist/nfpm-resolved.yaml --packager rpm --target dist/
            nfpm package -f dist/nfpm-resolved.yaml --packager apk --target dist/
            nfpm package -f dist/nfpm-resolved.yaml --packager archlinux --target dist/ || true
          fi
        fi

    - uses: actions/upload-artifact@v4
      if: inputs.package == 'true'
      with:
        overwrite: true
        name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
        path: dist/*

    - name: Release (Standalone fallback)
      uses: softprops/action-gh-release@v2
      if: inputs.package == 'true' && inputs.publish-release == 'true' && startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ inputs.tag }}
        files: dist/*
        body_path: CHANGELOG.md