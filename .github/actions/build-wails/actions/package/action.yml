name: "Package & Release"
description: "Uploads build artifacts and publishes GitHub Release on tag if enabled"
inputs:
  package:
    required: false
    default: "true"
  build-name:
    required: true
  os:
    description: "OS name (optional, from discovery). Defaults to runner.os"
    required: false
    default: ""
  arch:
    description: "Architecture (optional, from discovery). Defaults to detected arch"
    required: false
    default: ""
  tag:
    description: "Git tag (optional, from discovery)."
    required: false
    default: ""
  is-tag:
    description: "Whether the ref is a tag (optional, from discovery)."
    required: false
    default: ""
  short-sha:
    description: "Short commit SHA (optional, from discovery)."
    required: false
    default: ""
  ref:
    description: "Git ref (optional, from discovery)."
    required: false
    default: ""
  include-meta:
    description: "Include artifact_meta.json with discovery metadata in the uploaded artifact"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Compute artifact name
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        OS_IN="${{ inputs.os }}"
        ARCH_IN="${{ inputs.arch }}"
        TAG_IN="${{ inputs.tag }}"
        SHORT_SHA_IN="${{ inputs.short-sha }}"
        # Resolve OS
        if [ -z "$OS_IN" ]; then
          OS_IN="${{ runner.os }}"
        fi
        # Resolve ARCH
        if [ -z "$ARCH_IN" ]; then
          if command -v uname >/dev/null 2>&1; then
            M=$(uname -m || echo unknown)
          else
            M="$PROCESSOR_ARCHITECTURE"
          fi
          case "$M" in
            x86_64|amd64) ARCH_IN="amd64";;
            aarch64|arm64) ARCH_IN="arm64";;
            armv7l) ARCH_IN="armv7";;
            *) ARCH_IN="$M";;
          esac
        fi
        # Resolve revision label
        if [ -n "$TAG_IN" ]; then
          REV="$TAG_IN"
        else
          if [ -z "$SHORT_SHA_IN" ]; then
            GHS="${GITHUB_SHA:-}"
            SHORT_SHA_IN="${GHS:0:7}"
          fi
          REV="$SHORT_SHA_IN"
        fi
        NAME="${{ inputs.build-name }}_${OS_IN}_${ARCH_IN}_${REV}"
        echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_OUTPUT"
        echo "OS_RESOLVED=$OS_IN" >> "$GITHUB_OUTPUT"
        echo "ARCH_RESOLVED=$ARCH_IN" >> "$GITHUB_OUTPUT"

    - name: Write artifact_meta.json
      if: inputs.package == 'true' && inputs.include-meta == 'true'
      shell: bash
      env:
        IN_BUILD_NAME: ${{ inputs.build-name }}
        IN_OS: ${{ steps.meta.outputs.OS_RESOLVED }}
        IN_ARCH: ${{ steps.meta.outputs.ARCH_RESOLVED }}
        IN_REF: ${{ inputs.ref }}
        IN_TAG: ${{ inputs.tag }}
        IN_SHORT_SHA: ${{ inputs.short-sha }}
      run: |
        set -euo pipefail
        ref_val="$IN_REF"
        branch_val=""
        case "$ref_val" in
          refs/heads/*) branch_val="${ref_val#refs/heads/}" ;;
        esac
        cat > artifact_meta.json <<JSON
        {
          "build_name": "${IN_BUILD_NAME}",
          "os": "${IN_OS}",
          "arch": "${IN_ARCH}",
          "ref": "${ref_val}",
          "branch": "${branch_val}",
          "tag": "${IN_TAG}",
          "short_sha": "${IN_SHORT_SHA}"
        }
        JSON

    - name: Stage unique dist assets
      if: inputs.package == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        suffix="${{ steps.meta.outputs.OS_RESOLVED }}_${{ steps.meta.outputs.ARCH_RESOLVED }}"

        shopt -s nullglob
        for f in build/bin/*; do
          if [ -f "$f" ]; then
            filename=$(basename "$f")
            ext=""
            base="$filename"
            if [[ "$filename" == *.* ]]; then
              ext=".${filename#*.}"
              base="${filename%%.*}"
            fi
            new_name="${base}_${suffix}${ext}"
            cp "$f" "dist/${new_name}"
            echo "[DEBUG_LOG] Staged dist/${new_name}"
          fi
        done

        if [ -f "artifact_meta.json" ]; then
          cp artifact_meta.json "dist/artifact_meta_${suffix}.json"
        fi

    - uses: actions/upload-artifact@v4
      if: inputs.package == 'true'
      with:
        overwrite: 'true'
        name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
        path: dist/*

    - name: Release
      uses: softprops/action-gh-release@v1
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ inputs.tag }}
        files: dist/*