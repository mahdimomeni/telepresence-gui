name: "${APP_NAME}${PKG_NAME_SUFFIX}"
arch: "${TARGET_ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Mohammad Mahdi Momeni <mahdimomeni012@gmail.com>"
description: "A modern, cross-platform graphical user interface for Telepresence"
homepage: "https://github.com/mahdimomeni/telepresence-gui"
license: "MIT"

contents:
  - src: ./build/bin/${APP_NAME}
    dst: /usr/bin/${APP_NAME}
    file_info:
      mode: 0755
  - src: ./build/linux/${APP_NAME}.desktop
    dst: /usr/share/applications/${APP_NAME}.desktop
  - src: ./build/linux/icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png

depends:
  - libgtk-3-0
  - ${WEBKIT_DEB_DEP}

overrides:
  deb:
    depends:
      - libgtk-3-0
      - ${WEBKIT_DEB_DEP}
  rpm:
    depends:
      - gtk3
      - ${WEBKIT_RPM_DEP}
  apk:
    depends:
      - gtk+3.0
      - ${WEBKIT_APK_DEP}
  archlinux:
    depends:
      - gtk3
      - ${WEBKIT_ARCH_DEP}