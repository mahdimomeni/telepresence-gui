run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    # Syntax, types, core safety & bugs
    - govet
    - staticcheck
    - errcheck
    - typecheck
    - bodyclose
    - nilerr
    
    # Dead code detection
    - unused
    - ineffassign
    - unparam
    - unconvert
    
    # Code conventions, idiomatic style & best practices
    - revive
    - gocritic
    - gofmt
    - goimports
    - misspell
    - goconst
    - gosec
    - nakedret
    - whitespace
    - dogsled
    - predeclared

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment # Avoid micro-optimization noise unless requested
  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - unnamedResult
  goconst:
    min-len: 3
    min-occurrences: 3
  gosec:
    excludes:
      - G104 # errcheck already handles unchecked errors
  misspell:
    locale: US
  unused:
    field-writes-are-uses: false
    post-statements-are-reads: false
    exported-is-used: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - frontend
    - build
    - docs
